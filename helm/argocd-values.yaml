global:
  domain: "argocd.wheezy.lab"

configs:
  # Configuration principale ArgoCD
  cm:
    # URL publique d'ArgoCD
    url: "https://argocd.wheezy.lab"

    # Comptes API
    accounts.readonly: apiKey

    # Status badge
    statusbadge.enabled: true
    statusbadge.url: "https://argocd-badge.wheezy.fr/"

    # Configuration OIDC
    oidc.config: |
      name: Authentik
      issuer: https://auth.wheezy.fr/application/o/argocd/
      clientID: argocd
      clientSecret: $oidc-authentik.clientSecret
      clientAuthMethod: client_secret_post
      requestedScopes: [openid, profile, email]

  # Configuration RBAC
  rbac:
    policy.default: role:readonly
    policy.csv: |
      # Groupes Authentik - Admins
      g, wheezy-admins, role:admin

    scopes: "[groups]"

  # Paramètres ArgoCD
  params:
    server.insecure: true
    server.repo.server.plaintext: false
    controller.repo.server.plaintext: false
    applicationsetcontroller.repo.server.plaintext: false
    reposerver.disable.tls: false

# Dex désactivé
dex:
  enabled: false

# Configuration du serveur ArgoCD
server:
  ingress:
    enabled: true
    tls: true
